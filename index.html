<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="site-shell">
    <header class="site-header">
      <a href="./" class="brand" aria-label="Zerginox home">Zerginox<span class="brand-star" aria-hidden="true">✦</span></a>
      <nav aria-label="Main navigation"><a href="#games">Games</a><a class="nav-contact" href="mailto:zerginox@gmail.com">Contact <span aria-hidden="true">↗</span></a></nav>
    </header>
    <main id="main">
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-copy">

          <h1 id="hero-title" class="hero-wordmark">Zerginox</h1>
          <p class="hero-statement">A little weird.<br><em>By design.</em></p>

          <div class="hero-actions"><a class="button button-primary" href="#games">Explore the games <span aria-hidden="true">↓</span></a></div>

        </div>
        <div class="wizard-stage">
          <canvas id="wizard" width="690" height="640" role="img" aria-label="An original crooked-hatted wizard with moss for a beard, mismatched eyes, a toothy grin, and a glowing eye on his staff."></canvas>

        </div>
      </section>
      <section class="games-section" id="games" aria-labelledby="games-title">
        <div class="section-heading"><h2 id="games-title">Games</h2></div>
        <div class="game-grid">
          <article class="game-card salt-card">
            <a href="games/salt-altar/" class="game-art salt-art" tabindex="-1" aria-hidden="true"><img src="games/salt-altar/logo.png" alt="" width="1536" height="1024" loading="lazy"><span class="art-corner" aria-hidden="true">↗</span></a>

          </article>
          <article class="game-card fish-card">
            <a href="games/monster-fish/" class="game-art fish-art" tabindex="-1" aria-hidden="true"><canvas id="fish-preview" width="700" height="440"></canvas><span class="art-corner" aria-hidden="true">↗</span></a>
            <div class="game-copy"><div class="game-kicker prototype"><span class="status-dot"></span> IN DEVELOPMENT</div><h3>Monster Fish</h3><div class="game-meta"><span>25 creatures to find</span><span>Real-time encounters</span></div><a class="game-link" href="games/monster-fish/">Play Monster Fish <span aria-hidden="true">↗</span></a></div>
          </article>
        </div>
      </section>
    </main>
    <footer class="site-footer"><a class="brand footer-brand" href="./">Zerginox</a><a href="https://github.com/zerginox" target="_blank" rel="noopener noreferrer">GitHub <span aria-hidden="true">↗</span></a></footer>
