  <div class="wrap">
    <h1>Salt Altar</h1>
    <p>Gather the green offerings before time runs out.</p>

    <div class="ui">
      <div><strong>Food:</strong> <span id="score">0</span> / <span id="total">0</span></div>
      <div><strong>Lives:</strong> <span id="lives">3</span></div>
      <div><strong>Time:</strong> <span id="timer">30.0</span>s</div>
      <div>
        <button id="startBtn">Start</button>
        <button id="restartBtn">Restart</button>
      </div>
    </div>

    <canvas id="game" width="900" height="520"></canvas>
<div class="touch-controls" role="group" aria-label="Touch movement controls"><button type="button" data-key="ArrowLeft" aria-label="Move left">←</button><div class="vertical-controls"><button type="button" data-key="ArrowUp" aria-label="Move up">↑</button><button type="button" data-key="ArrowDown" aria-label="Move down">↓</button></div><button type="button" data-key="ArrowRight" aria-label="Move right">→</button></div>

    <p class="legend">Press Start • Countdown begins • Then move with Arrow keys, WASD, or the touch controls</p>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const totalEl = document.getElementById('total');
    const livesEl = document.getElementById('lives');
    const timerEl = document.getElementById('timer');
    const restartBtn = document.getElementById('restartBtn');
    const startBtn = document.getElementById('startBtn');

    const keys = {};
    const levelMusic = new Audio('Level_2.mp3');
    levelMusic.loop = true;
    levelMusic.preload = 'auto';

    const world = {
      width: canvas.width,
      height: canvas.height,
      score: 0,
      totalFood: 0,
      lives: 3,
      timeLimit: 30,
      timeLeft: 30,
      lastTime: 0,
      win: false,
      lose: false,
    };

    const slug = {
      x: 70,
      y: 260,
      w: 56,
      h: 32,
      speed: 2.6,
      facing: -1,
      wiggle: 0,
      hurtTimer: 0,
    };

    const enemySlugs = [
      {
        x: 785,
        y: 440,
        w: 96,
        h: 42,
        speed: 1.7,
        facing: -1,
        wiggle: 0,
        targetIndex: 0,
        scale: 0.85,
        waypoints: [
          { x: 785, y: 440 },
          { x: 580, y: 440 },
          { x: 580, y: 335 },
          { x: 800, y: 335 },
          { x: 800, y: 210 },
          { x: 610, y: 210 },
          { x: 610, y: 120 },
          { x: 780, y: 120 },
          { x: 780, y: 210 },
          { x: 800, y: 335 },
          { x: 785, y: 440 },
          { x: 455, y: 440 },
          { x: 455, y: 305 },
          { x: 280, y: 305 },
          { x: 280, y: 430 },
          { x: 120, y: 430 },
          { x: 120, y: 245 },
          { x: 280, y: 245 },
          { x: 280, y: 120 },
          { x: 120, y: 120 },
          { x: 120, y: 245 },
          { x: 455, y: 245 },
          { x: 455, y: 120 },
          { x: 610, y: 120 }
        ]
      },
      {
        x: 120,
        y: 120,
        w: 96,
        h: 42,
        speed: 1.55,
        facing: 1,
        wiggle: 0,
        targetIndex: 0,
        scale: 0.85,
        waypoints: [
          { x: 120, y: 120 },
          { x: 280, y: 120 },
          { x: 280, y: 245 },
          { x: 120, y: 245 },
          { x: 120, y: 430 },
          { x: 280, y: 430 },
          { x: 280, y: 305 },
          { x: 455, y: 305 },
          { x: 455, y: 120 },
          { x: 610, y: 120 },
          { x: 610, y: 210 },
          { x: 800, y: 210 },
          { x: 800, y: 335 },
          { x: 580, y: 335 },
          { x: 580, y: 440 },
          { x: 455, y: 440 }
        ]
      }
    ];

    const saltBlocks = [
      { x: 185, y: 55,  w: 95,  h: 130 },
      { x: 455, y: 60,  w: 85,  h: 130 },
      { x: 705, y: 65,  w: 95,  h: 120 },

      { x: 95,  y: 205, w: 105, h: 70 },
      { x: 360, y: 205, w: 155, h: 70 },
      { x: 625, y: 205, w: 105, h: 70 },

      { x: 215, y: 315, w: 95,  h: 130 },
      { x: 505, y: 300, w: 95,  h: 150 },
      { x: 760, y: 315, w: 90,  h: 95 },

      { x: 60,  y: 415, w: 90,  h: 50 },
      { x: 385, y: 435, w: 110, h: 45 }
    ];

    let foods = [];

    let gameStarted = false;
    let countdownActive = false;
    let countdownValue = 3;
    let winRedirectStarted = false;

    function clearKeys() {
      for (const key in keys) {
        delete keys[key];
      }
    }

    function makeFoods() {
      foods = [
        { x: 70,  y: 70,  r: 7, taken: false },
        { x: 350, y: 95,  r: 7, taken: false },
        { x: 610, y: 85,  r: 7, taken: false },
        { x: 845, y: 95,  r: 7, taken: false },
        { x: 260, y: 235, r: 7, taken: false },
        { x: 565, y: 240, r: 7, taken: false },
        { x: 790, y: 245, r: 7, taken: false },
        { x: 170, y: 455, r: 7, taken: false },
        { x: 665, y: 455, r: 7, taken: false },
        { x: 845, y: 455, r: 7, taken: false },
      ];
      world.totalFood = foods.length;
      totalEl.textContent = world.totalFood;
    }

    function updateUI() {
      scoreEl.textContent = world.score;
      livesEl.textContent = world.lives;
      timerEl.textContent = world.timeLeft.toFixed(1);
    }

    function clamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }

    function rectsOverlap(a, b) {
      return a.x < b.x + b.w &&
             a.x + a.w > b.x &&
             a.y < b.y + b.h &&
             a.y + a.h > b.y;
    }

    function circleRectOverlap(circle, rect) {
      const closestX = clamp(circle.x, rect.x, rect.x + rect.w);
      const closestY = clamp(circle.y, rect.y, rect.y + rect.h);
      const dx = circle.x - closestX;
      const dy = circle.y - closestY;
      return (dx * dx + dy * dy) < (circle.r * circle.r);
    }

    function respawnSlug() {
      slug.x = 25;
      slug.y = 245;
      slug.facing = -1;
      slug.hurtTimer = 60;
      clearKeys();
    }

    function resetEnemySlug(enemy, resetX, resetY, resetFacing = -1) {
      enemy.x = resetX;
      enemy.y = resetY;
      enemy.facing = resetFacing;
      enemy.wiggle = 0;
      enemy.targetIndex = 1;
    }

    function resetCoreState() {
      levelMusic.pause();
      levelMusic.currentTime = 0;
      slug.x = 25;
      slug.y = 245;
      slug.facing = -1;
      slug.hurtTimer = 0;
      slug.wiggle = 0;

      resetEnemySlug(enemySlugs[0], 785, 440, -1);
      resetEnemySlug(enemySlugs[1], 120, 120, 1);

      world.score = 0;
      world.lives = 3;
      world.timeLeft = world.timeLimit;
      world.lastTime = performance.now();
      world.win = false;
      world.lose = false;

      gameStarted = false;
      countdownActive = false;
      countdownValue = 3;
      winRedirectStarted = false;

      clearKeys();
      makeFoods();
      updateUI();
    }

    function resetGame(showStart = true) {
      resetCoreState();
      startBtn.disabled = !showStart;
    }

    function beginWinReturn() {
      if (winRedirectStarted) return;
      winRedirectStarted = true;
      levelMusic.pause();
      levelMusic.currentTime = 0;

      window.SaltAltarHost.advance(3);

      setTimeout(() => {
        window.location.href = 'index.html';
      }, 2000);
    }

    function beginCountdown() {
      if (countdownActive || gameStarted) return;

      clearKeys();
      countdownActive = true;
      countdownValue = 3;
      startBtn.disabled = true;

      const countdownInterval = setInterval(() => {
        countdownValue--;

        if (countdownValue <= 0) {
          clearInterval(countdownInterval);
          countdownActive = false;
          gameStarted = true;
          world.lastTime = performance.now();
        }
      }, 1000);
    }

    function startFirstRun() {
      if (countdownActive || gameStarted) return;
      clearKeys();
      levelMusic.currentTime = 0;
      levelMusic.play().catch(() => {});
      beginCountdown();
    }

    function restartAfterFail() {
      clearKeys();
      resetGame(false);
      levelMusic.currentTime = 0;
      levelMusic.play().catch(() => {});
      beginCountdown();
    }

    function moveEnemySlug(enemy) {
      const target = enemy.waypoints[enemy.targetIndex];
      if (!target) return;

      const dx = target.x - enemy.x;
      const dy = target.y - enemy.y;
      const dist = Math.hypot(dx, dy);

      if (dist < enemy.speed + 0.5) {
        enemy.x = target.x;
        enemy.y = target.y;
        enemy.targetIndex = (enemy.targetIndex + 1) % enemy.waypoints.length;
        return;
      }

      const vx = (dx / dist) * enemy.speed;
      const vy = (dy / dist) * enemy.speed;

      enemy.x += vx;
      enemy.y += vy;

      if (vx < -0.05) enemy.facing = -1;
      if (vx > 0.05) enemy.facing = 1;

      enemy.wiggle += 0.14;
    }

    function hitByEnemy() {
      if (slug.hurtTimer > 0) return;

      world.lives -= 1;
      updateUI();
      respawnSlug();

      if (world.lives <= 0) {
        world.lose = true;
        clearKeys();
        levelMusic.pause();
        levelMusic.currentTime = 0;
      }
    }

    function getEnemyHitbox(enemy) {
      return {
        x: enemy.x - 40,
        y: enemy.y - 18,
        w: 80,
        h: 36
      };
    }

    function update() {
      if (world.win || world.lose) return;
      if (!gameStarted) return;

      const now = performance.now();
      const dt = (now - world.lastTime) / 1000;
      world.lastTime = now;

      world.timeLeft = Math.max(0, world.timeLeft - dt);
      timerEl.textContent = world.timeLeft.toFixed(1);

      if (world.timeLeft <= 0) {
        world.lose = true;
        clearKeys();
        levelMusic.pause();
        levelMusic.currentTime = 0;
        return;
      }

      let dx = 0;
      let dy = 0;

      if (keys['arrowleft'] || keys['a']) {
        dx -= slug.speed;
        slug.facing = -1;
      }
      if (keys['arrowright'] || keys['d']) {
        dx += slug.speed;
        slug.facing = 1;
      }
      if (keys['arrowup'] || keys['w']) dy -= slug.speed;
      if (keys['arrowdown'] || keys['s']) dy += slug.speed;

      const nextX = clamp(slug.x + dx, 0, world.width - slug.w);
      const nextY = clamp(slug.y + dy, 0, world.height - slug.h);
      const nextSlug = { x: nextX, y: nextY, w: slug.w, h: slug.h };

      let hitSalt = false;
      for (const block of saltBlocks) {
        if (rectsOverlap(nextSlug, block)) {
          hitSalt = true;
          break;
        }
      }

      if (!hitSalt) {
        slug.x = nextX;
        slug.y = nextY;
      } else if (slug.hurtTimer <= 0) {
        world.lives -= 1;
        updateUI();
        respawnSlug();
        if (world.lives <= 0) {
          world.lose = true;
          clearKeys();
          levelMusic.pause();
          levelMusic.currentTime = 0;
        }
      }

      for (const enemy of enemySlugs) {
        moveEnemySlug(enemy);
      }

      const slugHitbox = {
        x: slug.x + 6,
        y: slug.y + 6,
        w: slug.w - 12,
        h: slug.h - 8
      };

      for (const enemy of enemySlugs) {
        const enemyHitbox = getEnemyHitbox(enemy);
        if (rectsOverlap(slugHitbox, enemyHitbox)) {
          hitByEnemy();
          break;
        }
      }

      slug.wiggle += 0.18;
      if (slug.hurtTimer > 0) slug.hurtTimer--;

      const mouth = {
        x: slug.x + slug.w * 0.72,
        y: slug.y + slug.h * 0.48,
        r: 12,
      };

      const pickupZone = {
        x: slug.x + 10,
        y: slug.y + 6,
        w: slug.w - 8,
        h: slug.h - 4,
      };

      for (const food of foods) {
        if (
          !food.taken &&
          (
            circleRectOverlap(food, {
              x: mouth.x - 13,
              y: mouth.y - 13,
              w: 26,
              h: 26
            }) ||
            circleRectOverlap(food, pickupZone)
          )
        ) {
          food.taken = true;
          world.score += 1;
          updateUI();
        }
      }

      if (world.score === world.totalFood) {
        world.win = true;
        clearKeys();
        beginWinReturn();
      }
    }

    function drawBackground() {
      const bg = ctx.createLinearGradient(0, 0, 0, canvas.height);
      bg.addColorStop(0, '#050605');
      bg.addColorStop(1, '#111612');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < 40; i++) {
        const x = (i * 97) % canvas.width;
        const y = (i * 61) % canvas.height;
        ctx.fillStyle = i % 3 === 0 ? 'rgba(180, 220, 170, 0.035)' : 'rgba(255,255,255,0.02)';
        ctx.beginPath();
        ctx.arc(x, y, 1 + (i % 3), 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.strokeStyle = 'rgba(70, 95, 70, 0.18)';
      ctx.lineWidth = 2;
      for (let x = 60; x < canvas.width; x += 150) {
        ctx.beginPath();
        ctx.moveTo(x, canvas.height);
        ctx.quadraticCurveTo(x - 20, canvas.height - 90, x + 10, canvas.height - 180);
        ctx.stroke();
      }

      ctx.fillStyle = 'rgba(12, 18, 12, 0.85)';
      ctx.fillRect(0, canvas.height - 70, canvas.width, 70);
    }

    function drawSaltBlock(block) {
      const x = block.x;
      const y = block.y;
      const w = block.w;
      const h = block.h;

      const glow = ctx.createRadialGradient(
        x + w / 2, y + h / 2, 6,
        x + w / 2, y + h / 2, Math.max(w, h) * 0.65
      );
      glow.addColorStop(0, 'rgba(200,245,230,0.10)');
      glow.addColorStop(1, 'rgba(200,245,230,0)');
      ctx.fillStyle = glow;
      ctx.fillRect(x - 16, y - 16, w + 32, h + 32);

      ctx.fillStyle = 'rgba(15,18,15,0.45)';
      ctx.beginPath();
      ctx.ellipse(x + w * 0.48, y + h + 8, w * 0.42, 10, 0, 0, Math.PI * 2);
      ctx.fill();

      const shards = [
        { cx: x + w * 0.22, cy: y + h * 0.62, sw: w * 0.34, sh: h * 0.72 },
        { cx: x + w * 0.50, cy: y + h * 0.50, sw: w * 0.42, sh: h * 0.98 },
        { cx: x + w * 0.76, cy: y + h * 0.64, sw: w * 0.30, sh: h * 0.68 }
      ];

      if (w > 90) {
        shards.push({ cx: x + w * 0.12, cy: y + h * 0.76, sw: w * 0.18, sh: h * 0.40 });
      }

      for (const shard of shards) {
        const sx = shard.cx;
        const sy = shard.cy;
        const sw = shard.sw;
        const sh = shard.sh;

        const poly = [
          { x: sx - sw * 0.45, y: sy + sh * 0.25 },
          { x: sx - sw * 0.10, y: sy - sh * 0.48 },
          { x: sx + sw * 0.22, y: sy - sh * 0.42 },
          { x: sx + sw * 0.42, y: sy - sh * 0.05 },
          { x: sx + sw * 0.30, y: sy + sh * 0.50 },
          { x: sx - sw * 0.20, y: sy + sh * 0.56 }
        ];

        ctx.fillStyle = 'rgba(235,255,248,0.85)';
        ctx.strokeStyle = '#0f1912';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(poly[0].x, poly[0].y);
        for (let i = 1; i < poly.length; i++) {
          ctx.lineTo(poly[i].x, poly[i].y);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = 'rgba(175,225,210,0.55)';
        ctx.beginPath();
        ctx.moveTo(poly[1].x, poly[1].y);
        ctx.lineTo(poly[2].x, poly[2].y);
        ctx.lineTo(poly[3].x, poly[3].y);
        ctx.lineTo(sx + sw * 0.05, sy + sh * 0.12);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.45)';
        ctx.beginPath();
        ctx.moveTo(sx - sw * 0.06, sy - sh * 0.28);
        ctx.lineTo(sx + sw * 0.05, sy - sh * 0.38);
        ctx.lineTo(sx + sw * 0.12, sy - sh * 0.06);
        ctx.lineTo(sx + sw * 0.00, sy + sh * 0.08);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = 'rgba(120,160,145,0.45)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(sx - sw * 0.04, sy - sh * 0.30);
        ctx.lineTo(sx - sw * 0.08, sy + sh * 0.44);
        ctx.stroke();
      }
    }

    function drawFood(food) {
      if (food.taken) return;

      ctx.beginPath();
      ctx.fillStyle = '#f7fff5';
      ctx.arc(food.x, food.y, food.r, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#97d48a';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.beginPath();
      ctx.fillStyle = 'rgba(180, 255, 180, 0.16)';
      ctx.arc(food.x, food.y, food.r + 5, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawSlugBody(baseA, baseB, hurtFlash) {
      const bodyGrad = ctx.createLinearGradient(0, 0, slug.w, slug.h);
      bodyGrad.addColorStop(0, hurtFlash ? '#6f7b58' : baseA);
      bodyGrad.addColorStop(1, hurtFlash ? '#303926' : baseB);
      ctx.fillStyle = bodyGrad;

      ctx.beginPath();
      ctx.moveTo(5, slug.h - 1);
      ctx.quadraticCurveTo(10, 4, 28, 5);
      ctx.quadraticCurveTo(44, 5, 55, 16);
      ctx.quadraticCurveTo(61, 22, 56, 28);
      ctx.quadraticCurveTo(51, 31, 36, 30);
      ctx.lineTo(10, 30);
      ctx.quadraticCurveTo(2, 29, 5, slug.h - 1);
      ctx.fill();

      ctx.strokeStyle = '#0a0d08';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.strokeStyle = '#0a0d08';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(16, 11);
      ctx.lineTo(15, -5);
      ctx.moveTo(28, 10);
      ctx.lineTo(31, -7);
      ctx.stroke();

      ctx.fillStyle = '#e9f7df';
      ctx.beginPath();
      ctx.arc(15, -5, 3.5, 0, Math.PI * 2);
      ctx.arc(31, -7, 3.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#0a0d08';
      ctx.beginPath();
      ctx.arc(15, -5, 1.8, 0, Math.PI * 2);
      ctx.arc(31, -7, 1.8, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.arc(20, 15, 1.7, 0, Math.PI * 2);
      ctx.arc(31, 14, 1.7, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#10150c';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(37, 19);
      ctx.quadraticCurveTo(44, 22, 37, 25);
      ctx.stroke();

      ctx.strokeStyle = '#a9c56d';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(12, 24);
      ctx.quadraticCurveTo(18, 20, 24, 24);
      ctx.quadraticCurveTo(30, 28, 36, 24);
      ctx.stroke();

      ctx.fillStyle = 'rgba(210, 255, 210, 0.08)';
      ctx.beginPath();
      ctx.ellipse(22, 12, 10, 4, -0.3, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawDefaultSlug() {
      const isHurtFlash = slug.hurtTimer > 0 && Math.floor(slug.hurtTimer / 5) % 2 === 0;
      drawSlugBody('#6e7f56', '#2b3323', isHurtFlash);
    }

    function drawEnemySlugBody() {
      ctx.fillStyle = 'rgba(0,0,0,0.18)';
      ctx.beginPath();
      ctx.ellipse(0, 18, 48, 10, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#d8cfb8';
      ctx.beginPath();
      ctx.ellipse(0, 0, 54, 24, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#b9ab8e';
      ctx.beginPath();
      ctx.ellipse(-2, 8, 48, 12, 0, 0, Math.PI);
      ctx.fill();

      const humps = [
        { x: -30, y: -6, w: 12, h: 10 },
        { x: -15, y: -9, w: 13, h: 11 },
        { x: 0,   y: -10, w: 14, h: 12 },
        { x: 16,  y: -8, w: 12, h: 10 },
        { x: 30,  y: -5, w: 10, h: 8 }
      ];

      ctx.fillStyle = '#e6dcc7';
      for (const h of humps) {
        ctx.beginPath();
        ctx.ellipse(h.x, h.y, h.w, h.h, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.strokeStyle = '#a99674';
      ctx.lineWidth = 2;
      const segmentXs = [-28, -12, 5, 22];
      for (const sx of segmentXs) {
        ctx.beginPath();
        ctx.moveTo(sx, -16);
        ctx.quadraticCurveTo(sx - 3, 0, sx, 15);
        ctx.stroke();
      }

      ctx.fillStyle = '#c9bea6';
      ctx.beginPath();
      ctx.ellipse(48, 2, 14, 12, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#6d6250';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(56, 6);
      ctx.quadraticCurveTo(60, 10, 64, 6);
      ctx.stroke();

      ctx.fillStyle = '#2e2a24';
      ctx.beginPath();
      ctx.arc(52, -1, 2.2, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#8d7f67';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(58, -6);
      ctx.lineTo(66, -12);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(58, -2);
      ctx.lineTo(67, -4);
      ctx.stroke();

      ctx.fillStyle = '#c4b89d';
      ctx.beginPath();
      ctx.ellipse(-52, 4, 8, 6, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = 'rgba(255,255,255,0.18)';
      ctx.beginPath();
      ctx.ellipse(-8, -10, 18, 6, -0.1, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawSlug() {
      const bob = Math.sin(slug.wiggle) * 2;
      const isHurtFlash = slug.hurtTimer > 0 && Math.floor(slug.hurtTimer / 5) % 2 === 0;

      ctx.save();
      ctx.translate(slug.x + slug.w / 2, slug.y + slug.h / 2 + bob);

      if (slug.facing === 1) {
        ctx.scale(-1, 1);
      }

      ctx.translate(-slug.w / 2, -slug.h / 2);

      if (isHurtFlash) {
        ctx.globalAlpha = 0.65;
      }

      drawDefaultSlug();
      ctx.restore();
    }

    function drawEnemySlug(enemy) {
      const bob = Math.sin(enemy.wiggle) * 2;

      ctx.save();
      ctx.translate(enemy.x, enemy.y + bob);

      if (enemy.facing === -1) {
        ctx.scale(-1, 1);
      }

      ctx.scale(enemy.scale, enemy.scale);
      drawEnemySlugBody();
      ctx.restore();
    }

    function drawMessage() {
      if (!world.win && !world.lose && !countdownActive && gameStarted) return;

      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = 'white';
      ctx.textAlign = 'center';

      if (countdownActive) {
        ctx.font = 'bold 80px Arial';
        ctx.fillText(String(countdownValue), canvas.width / 2, canvas.height / 2);
      } else if (!gameStarted) {
        ctx.font = 'bold 42px Arial';
        ctx.fillText('Press Start', canvas.width / 2, canvas.height / 2);
      } else if (world.win) {
        ctx.font = 'bold 42px Arial';
        ctx.fillText('Offering Accepted!', canvas.width / 2, canvas.height / 2 - 10);

        ctx.font = '24px Arial';
        ctx.fillText('Returning to altar...', canvas.width / 2, canvas.height / 2 + 35);
      } else if (world.lose) {
        ctx.font = 'bold 42px Arial';
        ctx.fillText('The ritual failed.', canvas.width / 2, canvas.height / 2 - 10);

        ctx.font = '24px Arial';
        ctx.fillText('Press Restart to play again', canvas.width / 2, canvas.height / 2 + 35);
      }

      ctx.textAlign = 'left';
    }

    function draw() {
      drawBackground();
      for (const block of saltBlocks) drawSaltBlock(block);
      for (const food of foods) drawFood(food);
      for (const enemy of enemySlugs) drawEnemySlug(enemy);
      drawSlug();
      drawMessage();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();
      if (['arrowleft', 'arrowright', 'arrowup', 'arrowdown', 'w', 'a', 's', 'd'].includes(key)) {
        e.preventDefault();
        keys[key] = true;
      }
    });

    window.addEventListener('keyup', (e) => {
      const key = e.key.toLowerCase();
      if (['arrowleft', 'arrowright', 'arrowup', 'arrowdown', 'w', 'a', 's', 'd'].includes(key)) {
        e.preventDefault();
        keys[key] = false;
      }
    });

    window.addEventListener('blur', clearKeys);

    startBtn.addEventListener('click', startFirstRun);
    restartBtn.addEventListener('click', restartAfterFail);

    resetGame(true);
    loop();
  </script>
</body>
</html>
